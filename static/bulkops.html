<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Datenimport - BetterAutoBerichtsheft</title>
<style>
  :root {
    --bg: #fafbfc; --card: #ffffff; --text: #0f1419; --text-muted: #57606a;
    --accent: #3b82f6; --accent-dark: #2563eb; --border: #d5dce0;
    --ok: #34c759; --err: #ef4444; --warn: #c9960c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419; --card: #1a1f28; --text: #f5f7fa; --text-muted: #a0a9b8;
      --border: #2d3544;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font: 16px/1.5 -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }

  .container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }

  h1 { font-size: 2rem; margin-bottom: 2rem; }

  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .section h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--accent); }

  .form-group {
    margin-bottom: 1rem;
  }

  label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    font-size: 0.9rem;
  }

  input[type="text"] {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  button {
    padding: 0.85rem 1.5rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  button:hover {
    background: var(--accent-dark);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }

  button:active {
    transform: translateY(0);
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  #status {
    margin-top: 1rem;
    padding: 1rem;
    border-radius: 8px;
    display: none;
    font-size: 0.9rem;
  }

  #status.ok {
    background: rgba(52, 199, 89, 0.1);
    color: var(--ok);
    border: 1px solid rgba(52, 199, 89, 0.3);
    display: block;
  }

  #status.err {
    background: rgba(239, 68, 68, 0.1);
    color: var(--err);
    border: 1px solid rgba(239, 68, 68, 0.3);
    display: block;
  }

  #status.loading {
    background: rgba(59, 130, 246, 0.1);
    color: var(--accent);
    border: 1px solid rgba(59, 130, 246, 0.3);
    display: block;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 1rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  .back-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="container">
  <a href="/" class="back-link">← Zurück</a>
  <h1>Datenimport</h1>

  <div class="section">
    <h2>WebUntis - Wochen abrufen</h2>
    <div class="form-group">
      <label for="startWeek">Von (z.B. 2026-W10):</label>
      <input type="text" id="startWeek" placeholder="2026-W10">
    </div>
    <div class="form-group">
      <label for="endWeek">Bis (z.B. 2026-W20):</label>
      <input type="text" id="endWeek" placeholder="2026-W20">
    </div>
    <button id="scrapeBtn">Alle Wochen abrufen</button>
    <div id="scrapeStatus"></div>
  </div>

  <div class="section">
    <h2>IHK - Historie abrufen</h2>
    <p style="margin-bottom: 1rem; color: var(--text-muted);">Kopiert alle Einträge von der IHK-Plattform lokal.</p>
    <button id="backfillBtn">IHK-Historie abrufen</button>
    <div id="backfillStatus"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function setStatus(el, msg, cls = "") {
  el.textContent = msg;
  el.className = cls;
}

$("scrapeBtn").onclick = async () => {
  const btn = $("scrapeBtn");
  const status = $("scrapeStatus");
  const startWeek = $("startWeek").value.trim();
  const endWeek = $("endWeek").value.trim();

  if (!startWeek || !endWeek) {
    setStatus(status, "Bitte beide Wochen eingeben", "err");
    return;
  }

  btn.disabled = true;
  setStatus(status, "Rufe Wochen ab...", "loading");

  try {
    const res = await fetch("/api/bulkops/scrape-weeks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ startWeek, endWeek })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");

    setStatus(status, `Fertig: ${data.weeks_scraped} Wochen abgerufen`, "ok");
  } catch (e) {
    setStatus(status, `Fehler: ${e.message}`, "err");
  } finally {
    btn.disabled = false;
  }
};

$("backfillBtn").onclick = async () => {
  const btn = $("backfillBtn");
  const status = $("backfillStatus");

  btn.disabled = true;
  setStatus(status, "Rufe IHK-Einträge ab...", "loading");

  try {
    const res = await fetch("/api/bulkops/backfill-ihk", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({})
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");

    setStatus(status, `Fertig: ${data.entries_scraped} Einträge abgerufen`, "ok");
  } catch (e) {
    setStatus(status, `Fehler: ${e.message}`, "err");
  } finally {
    btn.disabled = false;
  }
};
</script>

</body>
</html>
